plugins {
    id 'com.android.application'
}

android {
    namespace 'com.dshmobile.app'
    compileSdk 34

    defaultConfig {
        applicationId "com.dshmobile.app"
        minSdk 26
        targetSdk 34
        versionCode 2
        versionName "2.0"
    }

    signingConfigs {
        release {
            // CI 通过环境变量注入签名（KEYSTORE_FILE/KEYSTORE_PASS/KEY_ALIAS）；
            // keystore 为 PKCS12 格式（keyPassword 与 storePassword 同值）。
            // 本地没有环境变量时退回 debug 签名，方便直接构建安装。
            if (System.getenv("KEYSTORE_FILE") != null) {
                storeType 'PKCS12'
                storeFile file(System.getenv("KEYSTORE_FILE"))
                storePassword System.getenv("KEYSTORE_PASS")
                keyAlias System.getenv("KEY_ALIAS")
                keyPassword System.getenv("KEYSTORE_PASS")
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            if (System.getenv("KEYSTORE_FILE") != null) {
                signingConfig signingConfigs.release
            } else {
                signingConfig signingConfigs.debug
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    // FileProvider（拍照上传的缓存产物交付）
    implementation 'androidx.core:core:1.13.1'
}
