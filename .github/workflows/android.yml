name: Build APK

on:
  push:
    paths:
      - 'app/**'
      - 'build.gradle'
      - 'settings.gradle'
      - 'gradle.properties'
      - '.github/workflows/android.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.9'

      # 固定签名：签名密钥由仓库 Secret KEYSTORE_BASE64（keystore 的 base64，必须
      # 是 PKCS12 格式——build.gradle 里 storeType 固定 PKCS12）与 KEYSTORE_PASS 提供，
      # 升级可覆盖安装。缺 Secret 时退回一次性生成的临时 keystore（该次 APK 只能
      # 全新安装，不能覆盖升级）。
      - name: Restore release keystore
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            if [ -z "$KEYSTORE_PASS" ]; then
              echo '::error::KEYSTORE_BASE64 已配置但 KEYSTORE_PASS 为空——签名必然失败，请补齐 Secret'
              exit 1
            fi
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/dsh-release.keystore"
            keytool -list -keystore "$RUNNER_TEMP/dsh-release.keystore" -storepass "$KEYSTORE_PASS" >/dev/null 2>&1 \
              && echo '[signing] using fixed keystore from repository secret' \
              || { echo '::error::密钥库校验失败（base64 损坏或密码不符）'; exit 1; }
          else
            # 备用路径：无 Secret 时用 keytool 现场生成（Java 原生格式，必定可读），
            # 并把 keystore 作为工件上传——一次性引导：取回工件设为 KEYSTORE_BASE64
            # 即固定签名。之后每次构建都用同一把，升级可覆盖安装。
            # DSH_BOOTSTRAP 标记仅限本分支置位：有 Secret 的常规构建绝不上传密钥库
            echo 'DSH_BOOTSTRAP=1' >> "$GITHUB_ENV"
            keytool -genkeypair -v \
              -keystore "$RUNNER_TEMP/dsh-release.keystore" \
              -alias dsh -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass "$KEYSTORE_PASS" -keypass "$KEYSTORE_PASS" \
              -dname "CN=DSH Mobile, OU=Personal, O=Personal, L=City, ST=State, C=CN"
            echo '[signing] WARNING: no KEYSTORE_BASE64 secret, keystore is ephemeral'
          fi
          echo "KEYSTORE_FILE=$RUNNER_TEMP/dsh-release.keystore" >> "$GITHUB_ENV"
          echo "KEYSTORE_PASS=$KEYSTORE_PASS" >> "$GITHUB_ENV"
          echo "KEY_ALIAS=dsh" >> "$GITHUB_ENV"
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASS: ${{ secrets.KEYSTORE_PASS }}

      # 引导通道：仅「无 Secret 的备用分支」上传 keystore 工件（常规构建绝不外传）
      - name: Upload keystore artifact
        if: env.DSH_BOOTSTRAP == '1'
        uses: actions/upload-artifact@v7
        with:
          name: release-keystore
          path: ${{ runner.temp }}/dsh-release.keystore
          retention-days: 1

      - name: Build release APK
        run: gradle assembleRelease

      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: dsh-mobile-apk
          path: app/build/outputs/apk/release/app-release.apk

      # 每次构建成功自动发布到 Releases：固定版本号命名防下载缓存旧包
      - name: Publish GitHub Release
        run: |
          VERSION="v$(date +%Y%m%d-%H%M%S)"
          cp app/build/outputs/apk/release/app-release.apk "DSH-Remote-$VERSION.apk"
          gh release create "$VERSION" "DSH-Remote-$VERSION.apk" \
            --title "DSH Remote ${{ github.run_number }}" \
            --notes "Android APK — 手机直接下载安装"
        env:
          GH_TOKEN: ${{ github.token }}
